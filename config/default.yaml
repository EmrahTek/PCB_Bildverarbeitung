templates:
  board_dirs:
    - pcb_template_tools/data/preparation_output/warped
  component_dirs:
    ESP32:
      - pcb_template_tools/data/generated_templates/esp32
    USB_PORT:
      - pcb_template_tools/data/generated_templates/usb_port
    JST_CONNECTOR:
      - pcb_template_tools/data/generated_templates/jst_connector
    RESET_BUTTON:
      - pcb_template_tools/data/generated_templates/reset_button
  prepared_metadata_paths:
    - pcb_template_tools/data/generated_templates/templates_metadata.json
  rotation_turns: 0
  use_prepared_rois: false

runtime:
  window_name: PCB Component Detection
  exit_key: q
  processing_width: 960

board:
  output_size: [900, 460]
  blur_ksize: 5
  canny_t1: 45
  canny_t2: 135
  min_area_ratio: 0.01
  max_area_ratio: 0.65
  min_rectangularity: 0.30
  expected_aspect_ratio: 1.9565
  min_aspect_ratio: 1.00
  max_aspect_ratio: 3.40
  border_margin: 8
  close_kernel: 5
  open_kernel: 5
  search_expansion: 1.45
  min_score: 0.33
  min_tracked_score: 0.27
  verify_gray_weight: 0.65
  verify_edge_weight: 0.35
  verify_resize_width: 300
  min_objectness_score: 0.34
  geometry_weight: 0.42
  verify_weight: 0.23
  objectness_weight: 0.35
  max_reference_templates: 10

board_template:
  enabled: true
  search_resize_width: 960
  score_threshold: 0.28
  refresh_interval: 5
  max_candidates: 5
  max_templates: 4
  rotations: [0, 2]
  scales: [0.08, 0.10, 0.12, 0.14, 0.16, 0.18, 0.22, 0.26, 0.30, 0.36, 0.42, 0.50, 0.60, 0.72, 0.86, 1.00]
  gray_weight: 0.35
  edge_weight: 0.65
  blur_ksize: 3
  use_clahe: true
  min_template_size: 32

tracking:
  temporal_window: 5
  temporal_min_hits: 2
  max_missing_frames: 4
  hint_accept_score: 0.58

